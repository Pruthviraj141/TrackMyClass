
services:
  # ──────────────────────────────────────────────
  # Redis - Used for WebSockets & ML Caching
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trackmyclass-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ──────────────────────────────────────────────
  # Backend - FastAPI + ML Pipeline
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trackmyclass-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FIREBASE_CREDENTIALS_PATH=/app/firebase.json
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:z

  # ──────────────────────────────────────────────
  # Frontend - Vite React App
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trackmyclass-frontend
    ports:
      - "5173:5173"
    environment:
      # Use localhost:8000 because requests originate from the user's browser, not the container network!
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules

volumes:
  redis_data:
  frontend_node_modules:
